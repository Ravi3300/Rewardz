<div class="card">
    <div class="card-header">
        Categories
    </div>
    <div class="card-body">
        <div class="accordion" id="sidebarAccordion">
            <div class="accordion-item" *ngFor="let item of accordionItems">
                <h2 class="accordion-header" id="heading{{ item.id }}">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        [attr.data-bs-target]="'#collapse' + item.id" aria-expanded="false"
                        [attr.aria-controls]="'collapse' + item.id">
                        <span class="accordion-icon"><input type="checkbox" /></span>
                        <span class="accordion-text">{{ item.text }}</span>
                    </button>
                </h2>
            </div>
        </div>
    </div>
</div>
